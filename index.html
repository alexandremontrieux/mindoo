<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alexandre Montrieux · Go-to-Market</title>
<meta name="description" content="Alexandre Montrieux, application for Go-to-Market at Mindoo.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d0d0d; --ink2:#171717; --muted:#737373; --line:#e5e5e5; --soft:#f6f6f5; --bg:#fff;
  --blue:#2f7df6; --purple:#8b5cf6; --yellow:#f5c400; --pink:#f472b6; --green:#34c26b; --orange:#fb8a3c;
  --serif:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Inter Tight",Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:500;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}
.topbar{position:fixed;top:0;left:0;width:0;height:3px;z-index:60;background:linear-gradient(90deg,var(--blue),var(--green),var(--yellow),var(--orange),var(--pink),var(--purple)) left/100vw 100% no-repeat;transition:width .12s linear}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* nav */
header.nav{position:sticky;top:14px;z-index:50;margin-top:14px}
.navin{display:flex;align-items:center;justify-content:space-between;gap:16px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:8px 10px 8px 20px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.brand{font-family:var(--serif);font-size:22px;letter-spacing:-.03em;text-decoration:none;white-space:nowrap}
.brand i{font-style:normal;color:var(--blue)}
.links{display:flex;gap:22px}
.links a{font-size:14px;text-decoration:none;color:var(--ink2)}
.links a:hover{color:var(--blue)}
.navr{display:flex;align-items:center;gap:10px}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;padding:2px}
.lang button{font-size:12.5px;letter-spacing:.04em;padding:6px 9px;border-radius:8px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.btn{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;padding:11px 18px;border-radius:12px;text-decoration:none;border:1px solid var(--line);background:#fff;white-space:nowrap}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn:hover{transform:translateY(-1px)}
.btn .ar{color:var(--blue)}

/* hero */
.hero{position:relative;text-align:center;padding:44px 0 56px;overflow:hidden}
.hero:before{content:"";position:absolute;inset:-120px 0 auto 0;height:520px;z-index:-1;background:radial-gradient(600px 300px at 50% 30%,#eaf1ff 0,transparent 70%),radial-gradient(420px 240px at 12% 60%,#eafbf0 0,transparent 70%),radial-gradient(420px 240px at 88% 70%,#fdeef6 0,transparent 70%)}
.pill{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px 5px 5px;font-size:14px}
.pill b{font-weight:600;font-size:11px;letter-spacing:.1em;background:#e3eeff;color:#1c5fd0;border-radius:999px;padding:4px 9px}
.wink{font-size:13.5px;color:var(--muted);margin:0 0 26px}.wink a{color:var(--blue);text-decoration:none}
.avatar{width:116px;height:116px;background:#eef3fb;border-radius:50%;object-fit:cover;display:block;margin:0 auto 22px;border:1px solid var(--line)}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;color:#171717;overflow-wrap:anywhere}
h1{font-size:clamp(40px,7vw,80px);line-height:.98;letter-spacing:-.04em;margin:26px auto 22px;max-width:17ch;text-wrap:balance}
.hero p.sub{font-size:clamp(16px,1.6vw,18px);color:var(--muted);max-width:640px;margin:0 auto 28px;text-wrap:pretty}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.strip{margin-top:54px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* sections */
section{padding:84px 0;border-top:1px solid var(--line)}
section.alt{background:var(--soft)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center;margin-bottom:16px}
.eyebrow span{color:var(--blue)}
h2{font-size:clamp(34px,5vw,58px);line-height:1;letter-spacing:-.04em;max-width:17ch;text-wrap:balance}
.lead{color:var(--muted);font-size:17px;max-width:620px;margin:18px 0 0;text-wrap:pretty}
.hint{font-size:13px;color:var(--muted);margin-top:14px}
.hint:before{content:"↳ ";color:var(--blue)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;align-items:stretch;width:100%;transition:border-color .15s,box-shadow .15s}
button.card:hover,.card.open{border-color:#c9c9c9;box-shadow:0 6px 24px rgba(0,0,0,.05)}
.chead{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:10px}
.blob{width:38px;height:38px;border-radius:13px 13px 13px 4px;flex:none}
.tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:5px 10px;background:#efefef;color:#555;white-space:nowrap}
.tag.b{background:#e3eeff;color:#1c5fd0}
.card h3{font-size:25px;line-height:1.08;letter-spacing:-.03em;margin-bottom:10px}
.card p{margin:0;color:var(--muted);font-size:15.5px}
.more{font-size:14.5px;color:var(--blue);margin-top:16px;display:inline-flex;gap:6px;align-items:center}
.more .ch{transition:transform .2s;display:inline-block}
.open .more .ch{transform:rotate(90deg)}
.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.detail>div{overflow:hidden}
.open .detail{grid-template-rows:1fr}
.detail p{color:var(--ink2);padding-top:14px;margin-top:14px;border-top:1px solid var(--line)}
.src{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.src span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink2)}

/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:36px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 16px;font-size:14.5px}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.panel{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:36px}
.panel h3{font-size:32px;letter-spacing:-.03em;line-height:1.05}
.panel .role{font-size:14px;color:var(--blue);margin:10px 0 14px}
.panel .intro{color:var(--muted);margin:0}
.acc{border-top:1px solid var(--line)}
.acc:last-child{border-bottom:1px solid var(--line)}
.acc>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:15px 2px;font-size:16.5px}
.acc>button .pm{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--blue);transition:transform .2s;font-size:15px;line-height:1}
.acc.open>button .pm{transform:rotate(45deg)}
.acc .detail p{border:0;margin:0;padding:0 40px 16px 2px;color:var(--muted);font-size:15.5px}

/* two col */
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:40px}
.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}
.box h3{font-size:25px;letter-spacing:-.03em;margin-bottom:14px}
.net{list-style:none;margin:0;padding:0}
.net li{padding:14px 0;border-top:1px solid var(--line);display:flex;gap:12px}
.net li i{flex:none;width:9px;height:9px;border-radius:3px;margin-top:8px}
.net b{font-weight:600;display:block}
.net small{font-size:14.5px;color:var(--muted)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:36px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 18px;font-size:15.5px}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.quote{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 28px;font-family:var(--serif);font-size:clamp(21px,2.4vw,28px);line-height:1.2;letter-spacing:-.02em;max-width:820px;min-height:120px}

/* edu */
.edu{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px}
.edu .yr{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.edu h3{font-size:22px;letter-spacing:-.02em;line-height:1.12;margin-bottom:6px}
.edu p{margin:0;color:var(--muted);font-size:15px}
.langs{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.langs span{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:14.5px}
.langs span em{font-style:normal;color:var(--muted)}

/* contact */
.contact{text-align:center}
.contact h2{margin:0 auto;max-width:15ch}
.contact .lead{margin:18px auto 30px}
.cl{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
footer{border-top:1px solid var(--line);padding:26px 0 40px;font-size:13px;color:var(--muted);text-align:center}

@media (max-width:980px){.grid,.edu{grid-template-columns:1fr 1fr}.panel{grid-template-columns:1fr;gap:22px}.links{display:none}}
@media (max-width:640px){.grid,.edu,.two{grid-template-columns:1fr}section{padding:60px 0}.navin{padding-left:14px}.brand{font-size:19px}.navr .btn{display:none}.panel{padding:20px}.hero{padding-top:52px}}
@media (max-width:360px){.wrap{padding:0 14px}.brand{font-size:16px}.lang button{padding:6px 7px}.navin{gap:8px;padding-left:12px}}
.quote.all{font-family:var(--sans);font-size:14.5px;letter-spacing:0;line-height:1.45;max-width:none}.quote.all p{margin:0 0 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{header.nav,.topbar,.tabs,.hint,.more,.cta,.chips,.wink,.acc .pm{display:none!important}.panel{margin-top:10px}.detail{grid-template-rows:1fr!important}section{padding:28px 0}.card,.panel,.box{break-inside:avoid}}
</style>
</head>

 title:"Alexandre Montrieux · Go-to-Market",

 h1:"Hands-on go-to-market to make AI land in hospitals.",
 sub:"I led go-to-market at an AI startup for six months, alongside three years of data & AI consulting at AE. Since 2026 I have also been studying healthcare management. I would like to help Mindoo bring its agents into more hospitals.",
 cta2:"See the fit", strip:"Brussels · Dutch native · English fluent · French in progress",

 fit:{eye:"The fit", h:"What the role asks, and where I have done it.", lead:"I asked your recruitment agent what this role needs. Each card below is one of its answers, with my experience behind it.",
  cards:[
  {tag:"0 to 1",h:"Building a commercial engine",p:"I led go-to-market at Scribewave for six months and helped build its AI-first GTM engine.",d:"I did the prospecting, cold outreach, demos, follow-up and customer check-ins myself. I also built the automation behind it, with ICP-driven prospecting, email drafting and follow-up, all linked to the CRM.",s:["Scribewave"]},
  {tag:"Complex tech",h:"Selling AI to people who need to trust it",p:"I did presales at AE and demos at Scribewave. In both cases the buyer had to trust the technology first.",d:"At AE I led the set-up of a new data & AI strategy offering and pitched it to prospects and internal stakeholders, and adjusted the message based on their reactions. It is now sold across multiple engagements. My client work includes regulated settings such as insurance and a quality management system for a new chemical plant.",s:["AE","AG Insurance","INEOS"]},
  {tag:"Stakeholders",h:"From operational teams to the executive committee",p:"I am used to talking with executives, IT and operational teams, sometimes on the same day.",d:"I co-organised a roundtable for 20 high-priority prospects on developing and executing an AI strategy. In the management team of AE's Data & AI hive I translate direction from higher management to my own team. At Scribewave I called and emailed companies until I reached the right stakeholder.",s:["AE roundtable","Hive management","Scribewave"]},
  {tag:"Feedback to strategy",h:"Turning market feedback into a playbook",p:"I regularly sparred with Scribewave's founder about how the market reacted and what that meant for us.",d:"We discussed which messages worked and where new opportunities were showing up. I learned to finish the operational work and still make time for improvements to the go-to-market engine.",s:["Scribewave"]},
  {tag:"Autonomy",h:"Working independently, hands on",p:"At Scribewave I had a lot of freedom and I liked that.",d:"I worked directly with the founder and decided myself how to spend my time. Outside of work I build my own tools, such as an apartment-search scraper and a productivity hub that picks up actions on its own. The agile, hands-on way of working in a startup gave me energy.",s:["Scribewave","Side projects"]},
  {tag:"Healthcare",h:"Learning healthcare from close by",p:"I study healthcare management and my partner is a doctor.",d:"In 2026 I started the master in Management and Policy in Healthcare at KU Leuven, alongside my job. My partner is a doctor, so I hear a lot at home about the daily pressure on clinical teams. My first engagement in a care context was a data platform for Hospital Logistics. I have not sold into hospitals yet.",s:["KU Leuven","Hospital Logistics"]}

fr:{
 title:"Alexandre Montrieux · Go-to-Market",
 nav:["L'adéquation","Expérience","AI first","Santé","Ma façon de travailler"], cta:"Parlons-en",
 pillb:"CANDIDATURE", pill:"Go-to-Market chez Mindoo", wink:"Cette mise en page vous dit quelque chose ? Elle est inspirée de",
 h1:"Un go-to-market de terrain pour faire atterrir l'IA dans les hôpitaux.",
 sub:"J'ai dirigé pendant six mois le go-to-market d'une startup d'IA, à côté de trois ans de conseil en data & IA chez AE. Depuis 2026, j'étudie aussi le management des soins de santé. J'aimerais aider Mindoo à amener ses agents dans plus d'hôpitaux.",
 cta2:"Voir l'adéquation", strip:"Bruxelles · Néerlandais langue maternelle · Anglais courant · Français en progrès",
 more:"Voir les preuves", hint:"Cliquez sur une carte pour voir ce qui l'appuie.",
 fit:{eye:"L'adéquation", h:"Ce que le rôle demande, et où je l'ai déjà fait.", lead:"J'ai demandé à votre agent de recrutement ce que ce rôle exige. Chaque carte reprend l'une de ses réponses, avec mon expérience à l'appui.",
  cards:[
  {tag:"De 0 à 1",h:"Construire un moteur commercial",p:"J'ai dirigé le go-to-market chez Scribewave pendant six mois et j'ai aidé à construire son moteur GTM AI-first.",d:"Je faisais moi-même la prospection, le cold outreach, les démos, le suivi et les points de satisfaction client. J'ai aussi construit l'automatisation derrière, avec une prospection guidée par l'ICP et la rédaction et la relance d'e-mails, le tout relié au CRM.",s:["Scribewave"]},
  {tag:"Tech complexe",h:"Vendre l'IA à ceux qui doivent lui faire confiance",p:"J'ai fait de l'avant-vente chez AE et des démos chez Scribewave. Dans les deux cas, l'acheteur devait d'abord faire confiance à la technologie.",d:"Chez AE, j'ai piloté la mise en place d'une nouvelle offre de stratégie data & IA et je l'ai présentée à des prospects et à des parties prenantes internes, et j'ai ajusté le message selon leurs réactions. Elle est aujourd'hui vendue dans plusieurs missions. Mes missions couvrent des environnements régulés comme l'assurance, ainsi qu'un système de management de la qualité pour une nouvelle usine chimique.",s:["AE","AG Insurance","INEOS"]},
  {tag:"Parties prenantes",h:"Du terrain au comité de direction",p:"J'ai l'habitude de parler avec la direction, l'IT et les équipes opérationnelles, parfois dans la même journée.",d:"J'ai co-organisé une table ronde pour 20 prospects prioritaires sur l'élaboration et l'exécution d'une stratégie IA. Au sein de l'équipe de management du hive Data & IA d'AE, je traduis les orientations de la direction pour ma propre équipe. Chez Scribewave, j'ai appelé et écrit aux entreprises jusqu'à trouver le bon interlocuteur.",s:["Table ronde AE","Management du hive","Scribewave"]},
  {tag:"Du feedback à la stratégie",h:"Transformer les retours du marché en playbook",p:"J'échangeais régulièrement avec le fondateur de Scribewave sur les réactions du marché et ce qu'elles impliquaient pour nous.",d:"Nous discutions des messages qui fonctionnaient et des nouvelles opportunités qui apparaissaient. J'ai appris à terminer le travail opérationnel tout en gardant du temps pour améliorer le moteur go-to-market.",s:["Scribewave"]},
  {tag:"Autonomie",h:"Travailler en autonomie, sur le terrain",p:"Chez Scribewave, j'avais beaucoup de liberté et cela m'a plu.",d:"Je travaillais directement avec le fondateur et je décidais moi-même de l'emploi de mon temps. En dehors du travail, je construis mes propres outils, comme un scraper pour ma recherche d'appartement et un hub de productivité qui prend lui-même des actions en charge. La manière de travailler agile et concrète d'une startup m'a donné beaucoup d'énergie.",s:["Scribewave","Projets personnels"]},
  {tag:"Santé",h:"Apprendre les soins de santé de près",p:"J'étudie le management des soins de santé et ma partenaire est médecin.",d:"En 2026, j'ai commencé le master en Management et Politique des Soins de Santé à la KU Leuven, en parallèle de mon travail. Ma partenaire est médecin, et j'entends donc beaucoup parler à la maison de la pression quotidienne sur les équipes cliniques. Ma première mission dans un contexte de soins était une plateforme de données pour Hospital Logistics. Je n'ai pas encore vendu à des hôpitaux.",s:["KU Leuven","Hospital Logistics"]}
 ]},

document.addEventListener("click",function(e){
 var b=e.target.closest("button"); if(!b) return; var d=b.dataset, y=window.scrollY;
 if(d.l){S.lang=d.l; try{localStorage.setItem("cv-lang",d.l)}catch(_){}; try{history.replaceState(null,"","?lang="+d.l+location.hash)}catch(_){}}
 else if(d.fit!==undefined){S.fit=S.fit===+d.fit?-1:+d.fit}
 else if(d.ai!==undefined){S.ai=S.ai===+d.ai?-1:+d.ai}

 else if(d.acc){S.acc[d.acc]=!S.acc[d.acc]}
 else if(d.chip!==undefined){S.chip=+d.chip}
 else return;
 // toggle in place where possible so the open/close animates
 if(d.fit!==undefined||d.ai!==undefined){var key=d.fit!==undefined?"fit":"ai";[].forEach.call(document.querySelectorAll("[data-"+key+"]"),function(x){var o=S[key]===+x.dataset[key];x.classList.toggle("open",o);x.setAttribute("aria-expanded",o)});return}
 if(d.acc){var p=b.parentNode;p.classList.toggle("open",!!S.acc[d.acc]);b.setAttribute("aria-expanded",!!S.acc[d.acc]);return}
 render(); window.scrollTo(0,y);
});

window.addEventListener("beforeprint",function(){S.print=true;render()});
window.addEventListener("afterprint",function(){S.print=false;render()});
function progress(){var d=document.documentElement,m=d.scrollHeight-window.innerHeight;document.getElementById("progress").style.width=(m>0?Math.min(100,Math.max(0,window.scrollY/m*100)):0)+"%"}

(function(){

})();
